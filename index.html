<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=currency_exchange" />
</head>

<body>
  <div id="border">
    <div id="top-container">
      <h2>Currency Converter</h2>
    </div>
    <form>
      <!-- <p id="amount-heading">Enter Amount:</p> -->
      <input id='amount-input' type="text" value="" placeholder="0" autocomplete="off" pattern="[0-9]*">
      <div class="select-container">
        <div class="from box">
          <span>From</span>
          <div class="from select">
            <img src="https://flagsapi.com/US/flat/64.png" alt="">
            <select name="from">
            </select>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right-arrow-left swap"></i>
        <div class="to box">
          <span>To</span>
          <div class="to select">
            <img src="https://flagsapi.com/IN/flat/64.png" alt="">
            <select name="to">
            </select>
          </div>
        </div>
      </div>  
        <p id="result"></p>
        <button id="btn">Get Exchange Rate</button>
    </form>
  </div>
  </div>

  <script src="code.js"></script>
  <script src="script.js"></script>
</body>

</html>
